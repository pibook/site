
name: Build and deploy Jekyll site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "/site" \
            --destination _site
      - name: Diagnose timeline output
        run: |
          echo "Timeline source files tracked by Git:"
          git ls-files '*touchscreen-evolution*'
          echo "Timeline source file details:"
          ls -l _timeline/touchscreen-evolution.md
          echo "Jekyll collection configuration:"
          bundle exec jekyll build --verbose 2>&1 | grep -i 'touchscreen-evolution' || true
          echo "Timeline source files:"
          ls -la _timeline/
          echo "Generated timeline files:"
          find _site/timeline -maxdepth 4 -type f | sort
          echo "Timeline collection configuration:"
          bundle exec jekyll doctor
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
